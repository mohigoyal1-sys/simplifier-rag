spring.application.name=simplifier

server.port=8081

tavily.api-key=${TAVILY_API_KEY}

spring.ai.ollama.base-url=http://localhost:11434


spring.ai.ollama.chat.model=qwen3:0.6b

spring.ai.ollama.embedding.model=nomic-embed-text

logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.ai.ollama=DEBUG
logging.level.org.springframework.web.client=DEBUG

spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=research_chunks
spring.ai.vectorstore.qdrant.initialize-schema=true

spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=my-mcp-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.initialized=true
spring.ai.mcp.client.toolcallback.enabled=true

spring.ai.mcp.client.streamable-http.connections.server1.url=http://localhost:8082
# endpoint is optional; it defaults to /mcp
spring.ai.mcp.client.streamable-http.connections.server1.endpoint=/mcp
